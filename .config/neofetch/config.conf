print_info() {
    info "‎ ‎ User" title
    prin "┌──────────────────────────────┐"
    info "‎ ‎ OS" distro
    info "‎ ‎ Host" model
    info "‎ ‎ Kernel" kernel
    info "‎ ‎ Uptime" uptime
    info "‎ ‎ Packages" packages
    info "‎ ‎ Shell" shell
    info "‎ ‎ Display" resolution
    info "‎ ‎ DE" de
    info "‎ ‎ WM" wm
    info "‎ ‎ WM Theme" wm_theme
    info "‎ ‎ Theme" theme
    info "‎ ‎ Icons" icons
    info "‎ ‎ Terminal" term
    info "‎ ‎ CPU" cpu
    info "‎ ‎ GPU" gpu
    info "‎ ‎ Memory" memory
    info "‎ ‎ Disk" disk
    prin "‎ ‎ Battery" "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)% [$(cat /sys/class/power_supply/BAT*/status 2>/dev/null)]"
    prin "└──────────────────────────────┘"
    echo
    info cols
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
memory_unit="mib"
package_managers="on"
shell_path="off"
shell_version="on"

# CPU & Hardware formatting
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="C"
gpu_brand="on"
gpu_type="all"
refresh_rate="on"

# Disk & Battery clean formatting
disk_show=('/')
disk_subtitle="none"
disk_percent="on"
battery_display="off"

colors=(6 7 7 6 6 7)
bold="on"
underline_enabled="off"
separator=":"

block_range=(0 15)
color_blocks="on"
block_width=3
block_height=1

image_backend="ascii"
image_source="auto"
ascii_distro="arch"
ascii_colors=(6 6)
ascii_bold="on"
gap=3
